  stack: [Next.js 15, TypeScript, Groq, GitHub API]
  design_rationale: >
    "More context is better" is assumed more often than it's measured.
    ContextLens tests it directly on codebases — varying how much of a repo goes
    into the window and measuring what happens to answer quality, which
    surfaces the point where additional context stops helping and starts
    diluting.
    Built as a take-home assignment for Open Gigantic, and the one project in
    the portfolio that's a deployed TypeScript/Next.js app rather than a local
    Python system.
