- slug: assay
  name: Assay
  repo: SpandanNagale/Assay
  live_url: null
  status: archived
  one_liner: >
    An LLM evaluation harness with bootstrap confidence intervals and judge
    calibration.
  stack: [Python, statistical evaluation]
  design_rationale: >
    Most LLM eval reports a single accuracy number on a small test set and
    treats it as fact, when the sample is usually too small for the difference
    between two systems to mean anything. Assay adds bootstrap confidence
    intervals so a reported delta comes with an uncertainty range, and
    calibrates the judge model rather than assuming its scores are trustworthy.
    It's archived deliberately. The statistics were sound but the tool was too
    complex to actually use, which is a design failure regardless of how correct
    the internals are. The repo stays public because the underlying work is
    real, and the eval discipline from it now backs the portfolio assistant's
    grounding test suite.
  metrics: []
  key_files: []
  talking_points:
    - q: Why keep an archived project on your portfolio?
      a: >
        Because the reason it was archived is a real engineering lesson — a
        correct tool nobody can use isn't a finished tool. Hiding it would just
        mean pretending every project landed.

- slug: sieve
  name: Sieve
  repo: SpandanNagale/Sieve
  live_url: null
  status: complete
  one_liner: >
    Two-stage invoice anomaly detection — unsupervised ensemble first, then a
    weakly-supervised classifier trained on its output.
  stack: [Isolation Forest, LOF, LightGBM, SHAP, Streamlit, scikit-learn]
  design_rationale: >
    Anomaly detection on invoices has no labels to start from, so stage one is
    unsupervised — Isolation Forest and LOF over invoice-level features
    (quantity, value, SKU count, customer behavior), with seasonal decomposition
    so that legitimate seasonal spikes don't get flagged as anomalies. Single
    detectors were rejected; each catches a different anomaly shape and neither
    covers the space alone.
    Stage two converts that into supervision cheaply: 150 hand-labeled invoices
    plus roughly 2000 weak labels derived from stage one, used to train a
    LightGBM classifier that outputs both a flag and a probability. SHAP
    explains each flag, because an anomaly score nobody can interpret doesn't
    get acted on. Evaluated with bootstrap confidence intervals on 500K+
    transactions from the Online Retail dataset.
    Deliberately the non-LLM project in the portfolio — classical ML with
    evaluation rigor, to show the range isn't only agents.
  metrics: []
  key_files: []
  talking_points:
    - q: Why weak supervision instead of labeling more data?
      a: >
        Hand-labeling invoices is slow and the class is rare, so a purely
        supervised approach would spend most of its labeling budget on normal
        invoices. Bootstrapping labels from the unsupervised stage concentrates
        the manual effort where it changes the model.
